<!doctype html>
<html
  lang="zh"
  data-composition-variables='[
    {"id":"city-title","type":"string","label":"城市名","default":"诺里尔斯克"},
    {"id":"city-sub","type":"string","label":"城市副标题","default":"НОРИЛЬСК · 69°20′N 88°13′E"},
    {"id":"plateau-title","type":"string","label":"高原名","default":"普托拉纳高原"},
    {"id":"plateau-sub","type":"string","label":"高原副标题","default":"ПЛАТО ПУТОРАНА · 69°03′N 94°09′E"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>诺里尔斯克 → 普托拉纳高原</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "NP Title";
        src: url("assets/fonts/NotoSansSC-700-subset.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "NP Sub";
        src: url("assets/fonts/PTSansNarrow-700-subset.woff2") format("woff2");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b141c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b141c;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <!-- the whole film is one canvas drawn as a pure function of time (src/main.js) -->
      <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow=""></canvas>
      <!-- wind, hum, whooshes and pad, synthesised by tools/make-audio.mjs -->
      <audio id="score" src="assets/score.wav" data-start="0" data-duration="10" data-track-index="2" data-volume="1"></audio>
    </div>
    <script src="src/core.js"></script>
    <script src="src/camera.js"></script>
    <script src="src/engine.js"></script>
    <script src="src/titles.js"></script>
    <script src="src/city.js"></script>
    <script src="src/plateau.js"></script>
    <script src="src/main.js"></script>
    <script>
      // One paused root timeline; a proxy tween forwards HyperFrames time to the canvas.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      const clock = { t: 0 };
      window.__hf.buildReady["norilsk-fonts"] = NP.ready.then(() => NP.renderFrame(clock.t));
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: 10, duration: 10, ease: "none", onUpdate: () => NP.renderFrame(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
