<!doctype html>
<html
  lang="zh"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ink","type":"color","label":"Title colour","default":"#f3ede4"},
    {"id":"subframes","type":"number","label":"Sub-frames per frame (motion blur + AA; 6 for delivery)","default":1,"min":1,"max":12,"step":1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>诺里尔斯克 → 普托拉纳 · Norilsk → Putorana</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/build/three.module.js" } }
    </script>
    <style>
      :root {
        --color-ink: #f3ede4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #05070d;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <!-- the whole flight is one WebGL world drawn as a pure function of time (src/main.js) -->
      <canvas id="gl" width="1920" height="1080" data-layout-allow-overflow></canvas>

      <!-- location cards: one sub-composition each (copy and coordinates are its variables) -->
      <div id="card-city" data-composition-id="card-city" data-composition-src="compositions/card-city.html" data-start="0.2" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="card-plateau" data-composition-id="card-plateau" data-composition-src="compositions/card-plateau.html" data-start="8.45" data-duration="1.55" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- score and sound design, synthesised by tools/make-audio.mjs -->
      <audio id="score" src="assets/score.wav" data-start="0" data-duration="10" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      // WebGL: the module (src/main.js) builds the world, then hands back its renderer.
      // Every frame is drawn from the runtime's hf-seek time; nothing here keeps a clock.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let lastT = 0;
      let resolveWorld;
      window.__hf.buildReady["norilsk-world"] = new Promise((r) => (resolveWorld = r));
      window.__npBuilt = (render) => {
        window.__npRender = render;
        render(lastT);
        resolveWorld();
      };
      window.addEventListener("hf-seek", (e) => {
        lastT = e.detail.time;
        if (window.__npRender) window.__npRender(lastT);
      });

      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      if (vars["color-ink"]) document.documentElement.style.setProperty("--color-ink", vars["color-ink"]);
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
